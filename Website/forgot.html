<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgot.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useRef, useEffect} = React;

/* ── Password strength helper ── */
function getStrength(val) {
    if (!val) return null;
    let score = 0;
    if (val.length >= 6)  score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
        { width: '20%', color: '#e74c3c', text: 'Very weak' },
        { width: '40%', color: '#e67e22', text: 'Weak' },
        { width: '60%', color: '#f1c40f', text: 'Fair' },
        { width: '80%', color: '#2ecc71', text: 'Strong' },
        { width: '100%', color: '#27ae60', text: 'Very strong' },
    ];
    return levels[Math.min(score - 1, 4)];
}

/* ── Eye icons ── */
const EyeOpen = () => (
    <svg viewBox="0 0 20 20" fill="none">
        <path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z" stroke="currentColor" strokeWidth="1.3"/>
        <circle cx="10" cy="10" r="2.5" stroke="currentColor" strokeWidth="1.3"/>
    </svg>
);
const EyeClosed = () => (
    <svg viewBox="0 0 20 20" fill="none">
        <path d="M3 3l14 14M8.5 8.7A2.5 2.5 0 0 0 12.3 12" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
        <path d="M6.1 6.2C4.2 7.2 2.7 8.8 2 10c1.3 2.3 4.3 5 8 5a8.4 8.4 0 0 0 3.9-1M10 5c3.7 0 6.7 2.7 8 5a9.6 9.6 0 0 1-2.1 2.9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
    </svg>
);

/* ── Step transition wrapper ── */
function StepBox({ id, active, children }) {
    return (
        <div
            className={`form-container${active ? '' : ' hidden'}`}
            id={id}
            style={active ? {} : undefined}
        >
            {children}
        </div>
    );
}

function ForgotPage() {
    const [step, setStep]           = useState(1); // 1=email, 2=password, 3=success
    const [email, setEmail]         = useState('');
    const [emailErr, setEmailErr]   = useState('');
    const [newPw, setNewPw]         = useState('');
    const [confPw, setConfPw]       = useState('');
    const [pwErr, setPwErr]         = useState('');
    const [confErr, setConfErr]     = useState('');
    const [showPw, setShowPw]       = useState(false);
    const [showConf, setShowConf]   = useState(false);
    const strength                  = getStrength(newPw);


    useEffect(() => {
        if (localStorage.getItem('token')) {
            window.location.href = 'home.html';
        }
    }, []);


    async function handleForgotSubmit(e) {
    e.preventDefault();
    setEmailErr('');
    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email.trim()) { setEmailErr('Email address is required.'); return; }
    if (!regex.test(email.trim())) { setEmailErr('Please enter a valid email (must include @).'); return; }

    try {
        const res = await fetch('http://127.0.0.1:5000/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim() })
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            setEmailErr(err.error || 'Something went wrong.');
            return;
        }
        setStep(3);  // jump straight to success screen
    } catch (err) {
        setEmailErr('Could not reach the server. Please try again.');
    }
}

    function handleReset(e) {
        e.preventDefault();
        setPwErr(''); setConfErr('');
        let valid = true;
        if (!newPw)           { setPwErr('Please enter a new password.'); valid = false; }
        else if (newPw.length < 6) { setPwErr('Password must be at least 6 characters.'); valid = false; }
        if (!confPw)          { setConfErr('Please confirm your password.'); valid = false; }
        else if (newPw !== confPw) { setConfErr('Passwords do not match.'); valid = false; }
        if (!valid) return;
        // TODO: POST /api/auth/reset-password { token, newPassword }
        setStep(3);
    }

    return (
        <>
            <div className="bg-blob blob-1"></div>
            <div className="bg-blob blob-2"></div>
            <div className="bg-blob blob-3"></div>

            <div className="wrapper">
                {/* LEFT PANEL */}
                <div className="left-panel">
                    <div className="left-panel-bg"></div>
                    <div className="brand">
                        <a href="login.html">
                            <img src="logo.png" alt="AURA Logo" className="brand-logo" />
                        </a>
                    </div>
                    <div className="left-content">
                        <p className="eyebrow">Gender &amp; Development</p>
                        <h1 className="headline">
                            Automated<br/>
                            <em>Assessment</em><br/>
                            of Academic<br/>
                            Articles' GAD<br/>
                            Responsiveness
                        </h1>
                        <p className="tagline">Making <strong>equality</strong> the benchmark<br/>of academic excellence.</p>
                    </div>
                    <div className="left-footer">
                        <span>Cavite State University — CCAT Campus</span>
                        <span>© 2025</span>
                    </div>
                </div>

                {/* RIGHT PANEL */}
                <div className="right-panel">

                    {/* STEP 1: Email */}
                    <div className={`form-container${step === 1 ? '' : ' hidden'}`} id="stepEmail">
                        <div className="form-top">
                            <h2 className="form-heading">Forgot Password</h2>
                            <p className="form-sub">Enter your email address and we'll send you a reset link</p>
                        </div>
                        <form onSubmit={handleForgotSubmit} noValidate>
                            <div className="input-group">
                                <label htmlFor="resetEmail">Email Address</label>
                                <div className="input-wrap">
                                    <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                        <path d="M2.5 5.5h15l-7.5 6.5-7.5-6.5z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/>
                                        <rect x="2.5" y="5.5" width="15" height="10" rx="1" stroke="currentColor" strokeWidth="1.3"/>
                                    </svg>
                                    <input type="email" id="resetEmail" placeholder="Enter email address" autoComplete="email"
                                        value={email}
                                        onChange={e => { setEmail(e.target.value); setEmailErr(''); }}
                                        className={emailErr ? 'input-invalid' : ''}
                                    />
                                </div>
                                <span className="field-error">{emailErr}</span>
                            </div>
                            <button type="submit" className="btn-primary">
                                <span>Continue</span>
                                <svg viewBox="0 0 20 20" fill="none">
                                    <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                            </button>
                        </form>
                        <a className="back-link" href="login.html">
                            <svg viewBox="0 0 20 20" fill="none">
                                <path d="M13 4l-6 6 6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                            Back to Sign In
                        </a>
                    </div>

                    {/* STEP 2: New Password */}
                    <div className={`form-container${step === 2 ? '' : ' hidden'}`} id="stepPassword">
                        <div className="form-top">
                            <h2 className="form-heading">New Password</h2>
                            <p className="form-sub">Set a new password for your account</p>
                        </div>
                        <form onSubmit={handleReset} noValidate>
                            <div className="input-group">
                                <label htmlFor="newPassword">New Password</label>
                                <div className="input-wrap">
                                    <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                        <rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
                                        <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                                        <circle cx="10" cy="13" r="1.2" fill="currentColor"/>
                                    </svg>
                                    <input type={showPw ? 'text' : 'password'} id="newPassword" placeholder="At least 6 characters"
                                        value={newPw}
                                        onChange={e => { setNewPw(e.target.value); setPwErr(''); }}
                                        className={pwErr ? 'input-invalid' : ''}
                                    />
                                    <button type="button" className="eye-btn" onClick={() => setShowPw(v => !v)} tabIndex={-1}>
                                        {showPw ? <EyeClosed /> : <EyeOpen />}
                                    </button>
                                </div>
                                <span className="field-error">{pwErr}</span>
                            </div>

                            {/* Strength bar */}
                            <div className="strength-wrap" style={{ opacity: newPw ? 1 : 0 }}>
                                <div className="strength-bar">
                                    <div className="strength-fill" style={strength ? { width: strength.width, background: strength.color } : {}}></div>
                                </div>
                                <span className="strength-label" style={strength ? { color: strength.color } : {}}>{strength ? strength.text : ''}</span>
                            </div>

                            <div className="input-group">
                                <label htmlFor="confirmPassword">Confirm Password</label>
                                <div className="input-wrap">
                                    <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                        <rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
                                        <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                                        <circle cx="10" cy="13" r="1.2" fill="currentColor"/>
                                    </svg>
                                    <input type={showConf ? 'text' : 'password'} id="confirmPassword" placeholder="Repeat your password"
                                        value={confPw}
                                        onChange={e => { setConfPw(e.target.value); setConfErr(''); }}
                                        className={confErr ? 'input-invalid' : ''}
                                    />
                                    <button type="button" className="eye-btn" onClick={() => setShowConf(v => !v)} tabIndex={-1}>
                                        {showConf ? <EyeClosed /> : <EyeOpen />}
                                    </button>
                                </div>
                                <span className="field-error">{confErr}</span>
                            </div>

                            <button type="submit" className="btn-primary">
                                <span>Reset Password</span>
                                <svg viewBox="0 0 20 20" fill="none">
                                    <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                            </button>
                        </form>
                        <button className="back-link" onClick={() => setStep(1)}>
                            <svg viewBox="0 0 20 20" fill="none">
                                <path d="M13 4l-6 6 6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                            Back
                        </button>
                    </div>

                    {/* STEP 3: Success */}
                    <div className={`form-container${step === 3 ? '' : ' hidden'}`} id="stepSuccess">
                        <div className="form-top">
                            <h2 className="form-heading">Check Your Email</h2>
                            <p className="form-sub">If an account exists for that email address, we've sent a password reset link. Click the link in the email to set a new password, then return to sign in.</p>
                        </div>
                        <a href="login.html" className="btn-primary" style={{ textDecoration: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                            <span>Back to Sign In</span>
                            <svg viewBox="0 0 20 20" fill="none" style={{ width: '16px', height: '16px' }}>
                                <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                        </a>
                    </div>

                </div>
            </div>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ForgotPage />);
</script>
</body>
</html>
