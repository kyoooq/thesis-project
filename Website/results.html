<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>
    <link rel="stylesheet" href="results.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .hamburger {
            display: none; flex-direction: column; justify-content: center;
            gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; z-index: 200;
        }
        .hamburger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: transform 0.3s ease, opacity 0.3s ease; }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: linear-gradient(135deg, #3b2460, #6b4a8a); z-index: 150; flex-direction: column; padding: 16px 20px 24px; gap: 4px; box-shadow: 0 8px 24px rgba(59,36,96,0.3); }
        .mobile-menu.open { display: flex; }
        .mobile-menu .nav-link { color: rgba(255,255,255,0.85); font-size: 15px; padding: 10px 12px; border-radius: 8px; }
        .mobile-menu .nav-link:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .mobile-menu-divider { height: 1px; background: rgba(255,255,255,0.15); margin: 8px 0; }
        .mobile-menu-user { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
        .mobile-menu-user .nav-avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .mobile-menu-user span { color: rgba(255,255,255,0.85); font-size: 14px; }
        .mobile-menu .nav-logout { margin: 0; width: 100%; text-align: left; font-size: 14px; padding: 10px 12px; border-radius: 8px; }
        @media (max-width: 768px) { .hamburger { display: flex; } .nav-right { display: none !important; } }

        html { height: 100%; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        #root { flex: 1; display: flex; flex-direction: column; }
        .navbar { flex-shrink: 0; }
        .main { flex: 1 0 auto !important; }
        .footer { flex-shrink: 0; }

        @media (min-width: 641px) {
            .table-row {
                align-items: stretch !important;
            }
            .table-row .td {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                word-break: normal;
                overflow-wrap: anywhere;
                hyphens: auto;
                line-height: 1.5;
            }
            .table-row .td.td-link {
                align-items: center;
                justify-content: flex-start;
                text-align: left;
            }
            .table-row .td.td-link a {
                display: inline;
                white-space: normal;
            }
        }

        @media (max-width: 640px) {
            .table-header { display: none !important; }
            .table-row { grid-template-columns: 1fr !important; border: 1px solid #e0d7ef; border-radius: 12px; padding: 12px; background: #fff; }
            .td { border: none !important; border-radius: 0 !important; text-align: left !important; padding: 6px 8px; justify-content: flex-start !important; }
            .td::before { content: attr(data-label); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #a89fb5; display: block; margin-bottom: 2px; }
            .table-body { gap: 12px; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect} = React;

const AVATAR_COLORS = {
    amethyst: 'linear-gradient(135deg, #3b2460, #6b4a8a)',
    rose:     'linear-gradient(135deg, #8e2a4e, #c2547a)',
    teal:     'linear-gradient(135deg, #1e5f6e, #4a9aab)',
};

const DEFAULT_COLOR = 'amethyst';

function Navbar({user, onLogout, avatarGradient}) {
    const [menuOpen, setMenuOpen] = useState(false);
    const username = user?.name || 'User';
    const initials = user?.initials || username.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);

    useEffect(() => {
        function handler(e) {
            if (!e.target.closest('.mobile-menu') && !e.target.closest('.hamburger')) setMenuOpen(false);
        }
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
    }, []);

    return (
        <>
            <nav className="navbar">
                <div className="nav-left">
                    <a href="home.html" className="nav-brand">
                        <img src="logo.png" alt="AURA Logo" className="nav-logo" />
                        <div className="nav-brand-text">
                            <span className="nav-title">Automated Assessment of Academic Articles'</span>
                            <span className="nav-subtitle">GAD Responsiveness</span>
                        </div>
                    </a>
                </div>
                <div className="nav-right">
                    <a href="home.html"  className="nav-link">Home</a>
                    <a href="history.html" className="nav-link">Assessment History</a>
                    <a href="about.html" className="nav-link">About</a>
                    <div className="nav-divider"></div>
                    <span
                        className="nav-username"
                        onClick={() => window.location.href = 'profile.html'}
                        style={{ cursor: 'pointer' }}
                        title="View Profile"
                    >
                        {username}
                    </span>
                    <button
                        className="nav-avatar"
                        onClick={() => window.location.href = 'profile.html'}
                        title="View Profile"
                        style={avatarGradient ? { background: avatarGradient, borderColor: 'rgba(255,255,255,0.5)' } : undefined}
                    >
                        <svg
                            className="avatar-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    <button className="nav-logout" onClick={onLogout}>Logout</button>
                </div>
                <button className={`hamburger${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(v => !v)} aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </nav>
            <div className={`mobile-menu${menuOpen ? ' open' : ''}`}>
                <a href="home.html"  className="nav-link" onClick={() => setMenuOpen(false)}>Home</a>
                <a href="history.html" className="nav-link" onClick={() => setMenuOpen(false)}>Assessment History</a>
                <a href="about.html" className="nav-link" onClick={() => setMenuOpen(false)}>About</a>
                <div className="mobile-menu-divider"></div>
                <div className="mobile-menu-user">
                    <button
                        className="nav-avatar"
                        onClick={() => window.location.href = 'profile.html'}
                        style={avatarGradient ? { background: avatarGradient, borderColor: 'rgba(255,255,255,0.5)' } : undefined}
                    >
                        <svg
                            className="avatar-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    <span
                        onClick={() => window.location.href = 'profile.html'}
                        style={{ cursor: 'pointer' }}
                    >
                        {username}
                    </span>
                </div>
                <button className="nav-logout" onClick={() => { setMenuOpen(false); onLogout(); }}>Logout</button>
            </div>
        </>
    );
}

function LogoutModal({ show, onCancel, onConfirm }) {
    if (!show) return null;
    return (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
            <div className="modal-card">
                <div className="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                </div>
                <h3 className="modal-title">Sign Out</h3>
                <p className="modal-message">Are you sure you want to log out of your account?</p>
                <div className="modal-actions">
                    <button className="btn-cancel" onClick={onCancel}>Cancel</button>
                    <button className="btn-confirm" onClick={onConfirm}>Yes, Log Out</button>
                </div>
            </div>
        </div>
    );
}

function DetailModal({ detail, onClose }) {
    if (!detail) return null;
    return (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="detail-card">
                <div className="detail-header">
                    <div>
                        <h3 className="detail-title">{detail.title}</h3>
                        <p className="detail-subtitle">{detail.subtitle}</p>
                    </div>
                    <button className="detail-close" onClick={onClose}>×</button>
                </div>
                <div className="detail-body">
                    <div className="detail-left">
                        <p className="detail-issue" dangerouslySetInnerHTML={{ __html: detail.issue }}></p>
                    </div>
                    <div className="detail-right">
                        <div className="detail-rec-card">
                            <p className="detail-rec-label">Recommendation</p>
                            <div className="detail-rec-arrow">
                                <span className="detail-rec-from">{detail.recFrom}</span>
                                <svg viewBox="0 0 24 10" fill="none">
                                    <path d="M0 5h20M16 1l4 4-4 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                                <span className="detail-rec-to">{detail.recTo}</span>
                            </div>
                            <p className="detail-rec-note">{detail.recNote}</p>
                        </div>
                        <div className="detail-info-row">
                            <span className="detail-info-label">Model Source</span>
                            <span className="detail-info-value">{detail.model}</span>
                        </div>
                        <div className="detail-info-row">
                            <span className="detail-info-label">Score</span>
                            <span className="detail-info-value detail-score-val">{detail.score}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
}

function ResultsPage() {
    // TODO: Replace with real user from auth context
    const [user, setUser] = useState({ name: 'User', initials: 'U' });
    const [avatarColor, setAvatarColor] = useState(DEFAULT_COLOR);

    useEffect(() => {
        const token = localStorage.getItem('token');
        if (!token) return;

        fetch('http://127.0.0.1:5000/api/user/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(async r => {
                if (r.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('uid');
                    window.location.href = 'login.html';
                    return null;
                }
                if (!r.ok) return null;
                return r.json();
            })
            .then(data => {
                if (!data) return;
                const name = [data.firstName, data.lastName].filter(Boolean).join(' ') || 'User';
                const initials = ((data.firstName?.[0] || '') + (data.lastName?.[0] || '')).toUpperCase() || 'U';
                setUser({ name, initials });

                const color = (data.avatarColor && AVATAR_COLORS[data.avatarColor])
                    ? data.avatarColor
                    : DEFAULT_COLOR;
                setAvatarColor(color);
            })
            .catch(() => { /* silent fallback */ });
    }, []);

    const [logoutModal, setLogoutModal] = useState(false);
    const [detail, setDetail]           = useState(null);
    const [barWidth, setBarWidth]       = useState('0%');

    const [results, setResults] = useState(null); // null = no results yet
    // setResults(data) when backend responds

    useEffect(() => {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) return;

        fetch(`http://127.0.0.1:5000/api/results/${id}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(r => r.ok ? r.json() : Promise.reject(r))
            .then(data => setResults(data))
            .catch(err => console.error('Failed to load results:', err));
    }, []);

    useEffect(() => {
        if (!results) return;
        setBarWidth('0%');
        const t = setTimeout(() => setBarWidth(`${results.overallScore}%`), 120);
        return () => clearTimeout(t);
    }, [results]);

    async function doLogout() {
        const token = localStorage.getItem('token');
        if (token) {
            try {
                await fetch('http://127.0.0.1:5000/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch (err) {
                // Even if backend fails, clear local state
                console.error('Logout request failed:', err);
            }
        }
        localStorage.removeItem('token');
        localStorage.removeItem('uid');
        window.location.href = 'login.html';
    }

    return (
        <>
            <Navbar
                user={user}
                onLogout={() => setLogoutModal(true)}
                avatarGradient={AVATAR_COLORS[avatarColor] || AVATAR_COLORS[DEFAULT_COLOR]}
            />

            <main className="main">
                {/* SCORE SECTION */}
                <section className="score-section">
                    <p className="result-eyebrow">RESULT:</p>
                    <h1 className="result-heading">OVERALL GAD RESPONSIVENESS SCORE</h1>
                    {results ? (
                        <>
                            <div className="result-score">{results.overallLabel}</div>
                            <div className="score-bar-track">
                                <div className="score-bar-fill" style={{ width: barWidth, transition: 'width 1s cubic-bezier(0.22,1,0.36,1)' }}></div>
                            </div>
                        </>
                    ) : (
                        <div style={{
                            marginTop: '16px',
                            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '12px'
                        }}>
                            <div style={{
                                fontFamily: "'Cormorant Garamond', serif",
                                fontSize: 'clamp(28px, 4vw, 52px)',
                                fontWeight: 600,
                                color: '#a89fb5',
                                letterSpacing: '-0.01em',
                                lineHeight: 1
                            }}>— Awaiting Analysis —</div>
                            <div className="score-bar-track">
                                <div className="score-bar-fill" style={{ width: '0%' }}></div>
                            </div>
                        </div>
                    )}
                </section>

                {/* TABLE SECTION */}
                <section className="table-section">

                    {/* Dimension Summaries */}
                    {results && (
                        <div style={{
                            display: 'flex', alignItems: 'center', gap: '10px',
                            marginBottom: '14px', flexWrap: 'wrap'
                        }}>
                            {/* Authorship badge */}
                            <span style={{
                                fontSize: '11px', fontWeight: 600, letterSpacing: '0.1em',
                                textTransform: 'uppercase', color: '#a89fb5'
                            }}>Authorship</span>
                            <span style={{
                                background: (() => {
                                    const { maleNames, femaleNames } = results.stats;
                                    const total = maleNames + femaleNames;
                                    if (total === 0) return 'rgba(168,159,181,0.15)';
                                    const ratio = femaleNames / total;
                                    return (ratio >= 0.4 && ratio <= 0.6)
                                        ? 'rgba(76,175,130,0.12)'
                                        : 'rgba(180,80,100,0.10)';
                                })(),
                                color: (() => {
                                    const { maleNames, femaleNames } = results.stats;
                                    const total = maleNames + femaleNames;
                                    if (total === 0) return '#a89fb5';
                                    const ratio = femaleNames / total;
                                    return (ratio >= 0.4 && ratio <= 0.6) ? '#3a8f6a' : '#b45064';
                                })(),
                                borderRadius: '20px', padding: '4px 12px',
                                fontSize: '12px', fontWeight: 500
                            }}>
                                {(() => {
                                    const { maleNames, femaleNames, unknownNames } = results.stats;
                                    const total = maleNames + femaleNames;
                                    if (total === 0) return `No authors detected (${unknownNames} unknown)`;
                                    const ratio = femaleNames / total;
                                    const status = (ratio >= 0.4 && ratio <= 0.6) ? '✓ Balanced' : '⚠ Imbalanced';
                                    return `${status} — ${maleNames}M · ${femaleNames}F · ${unknownNames} unknown`;
                                })()}
                            </span>

                            {/* Representation badge */}
                            {results.stats.representationStatus !== 'not_applicable' && (() => {
                                const status = results.stats.representationStatus;
                                const isOk   = status === 'balanced';
                                const bg     = isOk ? 'rgba(76,175,130,0.12)' : 'rgba(180,80,100,0.10)';
                                const color  = isOk ? '#3a8f6a' : '#b45064';
                                const label  = status === 'missing'
                                    ? '⚠ No disaggregated data'
                                    : status === 'skewed'
                                        ? `⚠ Skewed — ${results.stats.repMaleCount}M · ${results.stats.repFemaleCount}F`
                                        : '✓ Balanced disaggregation';
                                return (
                                    <>
                                        <span style={{
                                            fontSize: '11px', fontWeight: 600, letterSpacing: '0.1em',
                                            textTransform: 'uppercase', color: '#a89fb5'
                                        }}>Representation</span>
                                        <span style={{
                                            background: bg, color,
                                            borderRadius: '20px', padding: '4px 12px',
                                            fontSize: '12px', fontWeight: 500
                                        }}>
                                            {label}
                                        </span>
                                    </>
                                );
                            })()}
                        </div>
                    )}

                    <div className="table-card">
                        <div className="table-header">
                            <div className="th">Key Aspects</div>
                            <div className="th">Word/s or Phrase</div>
                            <div className="th">Recommendation</div>
                            <div className="th">Model Source</div>
                            <div className="th th-score">Score</div>
                            <div className="th th-score">Contribution</div>
                        </div>
                        <div className="table-divider"></div>
                        <div className="table-body">
                            {!results ? (
                                <div style={{
                                    textAlign: 'center',
                                    padding: '48px 24px',
                                    display: 'flex',
                                    flexDirection: 'column',
                                    alignItems: 'center',
                                    gap: '14px'
                                }}>
                                    <svg viewBox="0 0 64 64" fill="none" style={{ width: '52px', height: '52px', color: '#d4c8e8' }}>
                                        <rect x="10" y="8" width="44" height="48" rx="5" stroke="currentColor" strokeWidth="2"/>
                                        <path d="M20 24h24M20 32h24M20 40h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                                        <circle cx="48" cy="48" r="10" fill="#f4f0fb" stroke="currentColor" strokeWidth="2"/>
                                        <path d="M44 48h8M48 44v8" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
                                    </svg>
                                    <p style={{
                                        fontFamily: "'Cormorant Garamond', serif",
                                        fontSize: '22px', fontWeight: 600,
                                        color: '#6b4a8a', margin: 0
                                    }}>No Results Yet</p>
                                    <p style={{
                                        fontSize: '13px', color: '#a89fb5',
                                        fontWeight: 300, lineHeight: 1.6,
                                        maxWidth: '320px', margin: 0
                                    }}>
                                        Upload and assess a document from the{' '}
                                        <a href="home.html" style={{ color: '#6b4a8a', textDecoration: 'underline' }}>Home page</a>{' '}
                                        to see the GAD responsiveness breakdown here.
                                    </p>
                                </div>
                            ) : results.rows.length === 0 ? (
                                <div style={{
                                    textAlign: 'center',
                                    padding: '48px 24px',
                                    display: 'flex',
                                    flexDirection: 'column',
                                    alignItems: 'center',
                                    gap: '14px'
                                }}>
                                    <div style={{
                                        width: '56px', height: '56px',
                                        borderRadius: '50%',
                                        background: 'rgba(76, 175, 130, 0.12)',
                                        color: '#4caf82',
                                        display: 'flex', alignItems: 'center', justifyContent: 'center'
                                    }}>
                                        <svg viewBox="0 0 24 24" fill="none" style={{ width: '30px', height: '30px' }}>
                                            <path d="M9 12l2 2 4-4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"
                                                stroke="currentColor" strokeWidth="1.8"
                                                strokeLinecap="round" strokeLinejoin="round"/>
                                        </svg>
                                    </div>
                                    <p style={{
                                        fontFamily: "'Cormorant Garamond', serif",
                                        fontSize: '22px', fontWeight: 600,
                                        color: '#3b2460', margin: 0
                                    }}>No issues detected</p>
                                    <p style={{
                                        fontSize: '13px', color: '#6b6478',
                                        fontWeight: 300, lineHeight: 1.6,
                                        maxWidth: '380px', margin: 0
                                    }}>
                                        This paper showed full GAD responsiveness — no problematic
                                        words, phrases, or authorship imbalances were flagged.
                                    </p>
                                </div>
                            ) : (
                                results.rows.map((row, i) => (
                                    <div className="table-row" key={i}>
                                        <div className="td" data-label="Key Aspects">{row.aspect}</div>
                                        <div className="td td-link" data-label="Word/s or Phrase">
                                            <a href="#" onClick={e => { e.preventDefault(); setDetail(row.detail); }}>{row.phrase}</a>
                                        </div>
                                        <div className="td" data-label="Recommendation">{row.recommendation}</div>
                                        <div className="td" data-label="Model Source">{row.model}</div>
                                        <div className="td td-score" data-label="Score">{row.score}</div>
                                        <div className="td td-score" data-label="Contribution">{row.contribution}</div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </section>
            </main>

            <footer className="footer">
                <span>© 2025</span>
                <span>Cavite State University — CCAT Campus</span>
                <span>English</span>
            </footer>

            <DetailModal detail={detail} onClose={() => setDetail(null)} />
            <LogoutModal show={logoutModal} onCancel={() => setLogoutModal(false)} onConfirm={doLogout} />
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ResultsPage />);
</script>
</body>
</html>
