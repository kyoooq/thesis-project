<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <link rel="stylesheet" href="about.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            z-index: 200;
        }
        .hamburger span {
            display: block; width: 22px; height: 2px;
            background: #fff; border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .mobile-menu {
            display: none; position: fixed;
            top: 64px; left: 0; right: 0;
            background: linear-gradient(135deg, #3b2460, #6b4a8a);
            z-index: 150; flex-direction: column;
            padding: 16px 20px 24px; gap: 4px;
            box-shadow: 0 8px 24px rgba(59,36,96,0.3);
        }
        .mobile-menu.open { display: flex; }
        .mobile-menu .nav-link { color: rgba(255,255,255,0.85); font-size: 15px; padding: 10px 12px; border-radius: 8px; }
        .mobile-menu .nav-link:hover, .mobile-menu .nav-link.active { background: rgba(255,255,255,0.12); color: #fff; }
        .mobile-menu-divider { height: 1px; background: rgba(255,255,255,0.15); margin: 8px 0; }
        .mobile-menu-user { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
        .mobile-menu-user .nav-avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .mobile-menu-user span { color: rgba(255,255,255,0.85); font-size: 14px; }
        .mobile-menu .nav-logout { margin: 0; width: 100%; text-align: left; font-size: 14px; padding: 10px 12px; border-radius: 8px; }
        @media (max-width: 768px) { .hamburger { display: flex; } .nav-right { display: none !important; } }

        /* Footer stays pinned at bottom regardless of content height or resize */
        html { height: 100%; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        #root { flex: 1; display: flex; flex-direction: column; }
        .navbar { flex-shrink: 0; }
        .main { flex: 1 0 auto !important; }
        .footer { flex-shrink: 0; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect} = React;

const AVATAR_COLORS = {
    amethyst: 'linear-gradient(135deg, #3b2460, #6b4a8a)',
    rose:     'linear-gradient(135deg, #8e2a4e, #c2547a)',
    teal:     'linear-gradient(135deg, #1e5f6e, #4a9aab)',
};

const DEFAULT_COLOR = 'amethyst';

function Navbar({activePage, user, onLogout, avatarGradient}) {
    const [menuOpen, setMenuOpen] = useState(false);
    const username = user?.name || 'User';
    const initials = user?.initials || username.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);

    useEffect(() => {
        function handler(e) {
            if (!e.target.closest('.mobile-menu') && !e.target.closest('.hamburger')) setMenuOpen(false);
        }
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
    }, []);

    return (
        <>
            <nav className="navbar">
                <div className="nav-left">
                    <a href="home.html" className="nav-brand">
                        <img src="logo.png" alt="AURA Logo" className="nav-logo" />
                        <div className="nav-brand-text">
                            <span className="nav-title">Automated Assessment of Academic Articles'</span>
                            <span className="nav-subtitle">GAD Responsiveness</span>
                        </div>
                    </a>
                </div>
                <div className="nav-right">
                    <a href="home.html"  className={`nav-link${activePage === 'home'  ? ' active' : ''}`}>Home</a>
                    <a href="history.html" className={`nav-link${activePage === 'history' ? ' active' : ''}`}>Assessment History</a>
                    <a href="about.html" className={`nav-link${activePage === 'about' ? ' active' : ''}`}>About</a>
                    <div className="nav-divider"></div>
                    <span className="nav-username">{username}</span>
                    <button
                        className="nav-avatar"
                        onClick={() => window.location.href = 'profile.html'}
                        title="View Profile"
                        style={avatarGradient ? { background: avatarGradient, borderColor: 'rgba(255,255,255,0.5)' } : undefined}
                    >
                        <svg
                            className="avatar-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    <button className="nav-logout" onClick={onLogout}>Logout</button>
                </div>
                <button className={`hamburger${menuOpen ? ' open' : ''}`} onClick={() => setMenuOpen(v => !v)} aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </nav>
            <div className={`mobile-menu${menuOpen ? ' open' : ''}`}>
                <a href="home.html"  className={`nav-link${activePage === 'home'  ? ' active' : ''}`} onClick={() => setMenuOpen(false)}>Home</a>
                <a href="history.html" className={`nav-link${activePage === 'history' ? ' active' : ''}`} onClick={() => setMenuOpen(false)}>Assessment History</a>
                <a href="about.html" className={`nav-link${activePage === 'about' ? ' active' : ''}`} onClick={() => setMenuOpen(false)}>About</a>
                <div className="mobile-menu-divider"></div>
                <div className="mobile-menu-user">
                    <button
                        className="nav-avatar"
                        onClick={() => window.location.href = 'profile.html'}
                        style={avatarGradient ? { background: avatarGradient, borderColor: 'rgba(255,255,255,0.5)' } : undefined}
                    >
                        <svg
                            className="avatar-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    <span>{username}</span>
                </div>
                <button className="nav-logout" onClick={() => { setMenuOpen(false); onLogout(); }}>Logout</button>
            </div>
        </>
    );
}

function LogoutModal({ show, onCancel, onConfirm }) {
    if (!show) return null;
    return (
        <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
            <div className="modal-card">
                <div className="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                </div>
                <h3 className="modal-title">Sign Out</h3>
                <p className="modal-message">Are you sure you want to log out of your account?</p>
                <div className="modal-actions">
                    <button className="btn-cancel" onClick={onCancel}>Cancel</button>
                    <button className="btn-confirm" onClick={onConfirm}>Yes, Log Out</button>
                </div>
            </div>
        </div>
    );
}

/* ── TeamCard with hardcoded photo ── */
function TeamCard({ name, role, badgeText, badgeClass, isAdviser, photoKey }) {
    const wrapSize  = isAdviser ? 90 : 80;
    const cardClass = isAdviser ? 'team-card adviser-card' : 'team-card';
    const photo     = TEAM_PHOTOS[photoKey];

    return (
        <div className={cardClass}>
            <div
                className="team-avatar-wrap"
                style={{ width: wrapSize, height: wrapSize, overflow: 'hidden', borderRadius: '50%' }}
            >
                <img
                    src={photo} alt={name}
                    style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', borderRadius: '50%' }}
                />
            </div>
            <div className={`team-badge ${badgeClass}`}>{badgeText}</div>
            <h3 className="team-name">{name}</h3>
            <p className="team-role">{role}</p>
        </div>
    );
}

function AboutPage() {
    // TODO: Replace with real user data from auth context
    const [user, setUser] = useState({ name: 'User', initials: 'U' });
    const [avatarColor, setAvatarColor] = useState(DEFAULT_COLOR);

    useEffect(() => {
        const token = localStorage.getItem('token');
        if (!token) return;

        fetch('http://127.0.0.1:5000/api/user/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(async r => {
                if (r.status === 401) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('uid');
                    window.location.href = 'login.html';
                    return null;
                }
                if (!r.ok) return null;
                return r.json();
            })
            .then(data => {
                if (!data) return;
                const fullName = `${data.firstName || ''} ${data.lastName || ''}`.trim();
                const initials = [data.firstName, data.lastName]
                    .filter(Boolean)
                    .map(n => n[0])
                    .join('')
                    .toUpperCase();
                setUser({ name: fullName || 'User', initials: initials || 'U' });

                const color = (data.avatarColor && AVATAR_COLORS[data.avatarColor])
                    ? data.avatarColor
                    : DEFAULT_COLOR;
                setAvatarColor(color);
            })
            .catch(() => { /* silent fallback */ });
    }, []);
    
    const [logoutModal, setLogoutModal] = useState(false);


    useEffect(() => {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }
    }, []);


    async function doLogout() {
        const token = localStorage.getItem('token');
        if (token) {
            try {
                await fetch('http://127.0.0.1:5000/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch (err) {
                // Even if backend fails, clear local state
                console.error('Logout request failed:', err);
            }
        }
        localStorage.removeItem('token');
        localStorage.removeItem('uid');
        window.location.href = 'login.html';
    }

    return (
        <>
            <Navbar
                user={user}
                onLogout={() => setLogoutModal(true)}
                avatarGradient={AVATAR_COLORS[avatarColor] || AVATAR_COLORS[DEFAULT_COLOR]}
            />

            <main className="main">
                {/* ABOUT SECTION */}
                <section className="about-section">
                    <div className="about-hero">
                        <p className="about-eyebrow">Who We Are</p>
                        <h1 className="about-heading">About Us</h1>
                        <p className="about-lead">Automated Assessment of Academic Articles' GAD Responsiveness</p>
                    </div>

                    <div className="about-cards">
                        <div className="about-card">
                            <div className="about-card-icon">
                                <svg viewBox="0 0 32 32" fill="none">
                                    <circle cx="16" cy="16" r="13" stroke="currentColor" strokeWidth="1.5"/>
                                    <path d="M16 10v6l4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                                </svg>
                            </div>
                            <h3 className="about-card-title">Our Mission</h3>
                            <p className="about-card-text">Our team is dedicated to making the assessment of GAD (Gender and Development) responsiveness in academic papers straightforward and worry-free. Wouldn't it be better if your valuable time could be focused on thoughtful research, instead of repetitive, exhausting checks?</p>
                        </div>

                        <div className="about-card">
                            <div className="about-card-icon">
                                <svg viewBox="0 0 32 32" fill="none">
                                    <path d="M6 26V18l10-10 10 10v8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                                    <rect x="12" y="20" width="8" height="6" rx="1" stroke="currentColor" strokeWidth="1.5"/>
                                </svg>
                            </div>
                            <h3 className="about-card-title">Our Story</h3>
                            <p className="about-card-text">Our goal has always been to offer a quick, accessible, and top-quality service that is easy for every evaluator and researcher to use. This project was born out of a personal need to simplify GAD responsiveness, and it has grown into a powerful tool aimed at serving the entire academic community.</p>
                        </div>

                        <div className="about-card">
                            <div className="about-card-icon">
                                <svg viewBox="0 0 32 32" fill="none">
                                    <rect x="4" y="4" width="24" height="24" rx="3" stroke="currentColor" strokeWidth="1.5"/>
                                    <path d="M9 16h14M9 11h9M9 21h6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                                </svg>
                            </div>
                            <h3 className="about-card-title">What We Do</h3>
                            <p className="about-card-text">This system is designed to provide you with instant, objective feedback on aspects like gender-sensitive language, inclusion, stereotyping, and citation balance — making GAD responsiveness easier was a problem worth solving, and that's why our team works to offer you a supportive and enjoyable document review experience.</p>
                        </div>
                    </div>
                </section>

                {/* TEAM SECTION */}
                <section className="team-section">
                    <p className="team-eyebrow">The People Behind the Project</p>
                    <h2 className="team-heading">Meet the Team</h2>

                    {/* Advisers */}
                    <div className="team-row team-advisers">
                        <TeamCard
                            name="Mr. Karlo Jose Nabablit"
                            role="Research Adviser"
                            badgeText="Research Adviser"
                            badgeClass="adviser-badge"
                            isAdviser={true}
                            photoKey="karlo"
                        />
                        <TeamCard
                            name="Mr. Vince Lorenz Dela Rea"
                            role="Technical Critic"
                            badgeText="Technical Critic"
                            badgeClass="critic-badge"
                            isAdviser={true}
                            photoKey="vince"
                        />
                    </div>

                    {/* Members */}
                    <div className="team-row team-members">
                        <TeamCard
                            name="MyangGun Kim"
                            role="Project Leader & Programmer"
                            badgeText="Project Leader"
                            badgeClass="member-badge"
                            photoKey="kim"
                        />
                        <TeamCard
                            name="Paulo Gabriel Alarcon"
                            role="UI/UX Designer & Programmer"
                            badgeText="UI/UX Designer"
                            badgeClass="member-badge"
                            photoKey="paulo"
                        />
                        <TeamCard
                            name="Joshua Angeles"
                            role="Frontend Developer & Programmer"
                            badgeText="Frontend Developer"
                            badgeClass="member-badge"
                            photoKey="joshua"
                        />
                    </div>
                </section>
            </main>

            <footer className="footer">
                <span>© 2025</span>
                <span>Cavite State University — CCAT Campus</span>
                <span>English</span>
            </footer>

            <LogoutModal show={logoutModal} onCancel={() => setLogoutModal(false)} onConfirm={doLogout} />
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AboutPage />);
</script>
</body>
</html>
