<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useRef, useEffect} = React;

function RegisterPage() {
    const [fields, setFields] = useState({ firstName: '', lastName: '', email: '', password: '', confirm: '' });
    const [show, setShow]     = useState({ pw: false, confirm: false });
    const [errors, setErrors] = useState({});
    const [toast, setToast]   = useState({ msg: '', type: '', show: false });
    const toastTimer = useRef(null);


    useEffect(() => {
        if (localStorage.getItem('token')) {
            window.location.href = 'home.html';
        }
    }, []);

    
    function showToast(msg, type) {
        setToast({ msg, type, show: true });
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(t => ({ ...t, show: false })), 3500);
    }

    function setField(key, val) {
        setFields(f => ({ ...f, [key]: val }));
        setErrors(e => ({ ...e, [key]: '' }));
    }

    function validate() {
        const errs = {};
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!fields.firstName.trim()) errs.firstName = 'First name is required.';
        if (!fields.lastName.trim())  errs.lastName  = 'Last name is required.';
        if (!fields.email.trim())     errs.email     = 'Email address is required.';
        else if (!emailRegex.test(fields.email.trim())) errs.email = 'Please enter a valid email (must include @).';
        if (!fields.password)         errs.password  = 'Password is required.';
        else if (fields.password.length < 8) errs.password = 'Password must be at least 8 characters.';
        if (!fields.confirm)          errs.confirm   = 'Please confirm your password.';
        else if (fields.password !== fields.confirm) errs.confirm = 'Passwords do not match.';
        setErrors(errs);
        return Object.keys(errs).length === 0;
    }

    async function handleRegister(e) {
        e.preventDefault();
        if (!validate()) return;
        try {
            const res = await fetch('http://127.0.0.1:5000/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName: fields.firstName, 
                    lastName: fields.lastName, 
                    email: fields.email, 
                    password: fields.password,
                })
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || 'Registration failed.');
            }
            showToast('Account created! Check your email to verify your address.', 'success');
            setTimeout(() => window.location.href = 'login.html', 2500);
        } catch (err) {
            showToast(err.message, 'error');
        }
    }

    const EyeOpen = () => (
        <svg viewBox="0 0 20 20" fill="none">
            <path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z" stroke="currentColor" strokeWidth="1.3"/>
            <circle cx="10" cy="10" r="2.5" stroke="currentColor" strokeWidth="1.3"/>
        </svg>
    );
    const EyeClosed = () => (
        <svg viewBox="0 0 20 20" fill="none">
            <path d="M3 3l14 14M8.5 8.7A2.5 2.5 0 0 0 12.3 12" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
            <path d="M6.1 6.2C4.2 7.2 2.7 8.8 2 10c1.3 2.3 4.3 5 8 5a8.4 8.4 0 0 0 3.9-1M10 5c3.7 0 6.7 2.7 8 5a9.6 9.6 0 0 1-2.1 2.9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
        </svg>
    );

    return (
        <>
            <div className="bg-blob blob-1"></div>
            <div className="bg-blob blob-2"></div>
            <div className="bg-blob blob-3"></div>

            <div className="wrapper">
                {/* LEFT PANEL */}
                <div className="left-panel">
                    <div className="left-panel-bg"></div>
                    <div className="brand">
                        <a href="login.html">
                            <img src="logo.png" alt="AURA Logo" className="brand-logo" />
                        </a>
                    </div>
                    <div className="left-content">
                        <p className="eyebrow">Gender &amp; Development</p>
                        <h1 className="headline">
                            Automated<br/>
                            <em>Assessment</em><br/>
                            of Academic<br/>
                            Articles' GAD<br/>
                            Responsiveness
                        </h1>
                        <p className="tagline">Making <strong>equality</strong> the benchmark<br/>of academic excellence.</p>
                    </div>
                    <div className="left-footer">
                        <span>Cavite State University — CCAT Campus</span>
                        <span>© 2025</span>
                    </div>
                </div>

                {/* RIGHT PANEL */}
                <div className="right-panel">
                    <div className="form-container">
                        <div className="form-top">
                            <h2 className="form-heading">Create Account</h2>
                            <p className="form-sub">Fill in the details below to get started</p>
                        </div>

                        <form onSubmit={handleRegister} noValidate>
                            {/* Name Row */}
                            <div className="form-row">
                                <div className="input-group">
                                    <label htmlFor="firstName">First Name</label>
                                    <div className="input-wrap">
                                        <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                            <circle cx="10" cy="7" r="3.5" stroke="currentColor" strokeWidth="1.3"/>
                                            <path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                                        </svg>
                                        <input type="text" id="firstName" placeholder="Juan" autoComplete="given-name"
                                            value={fields.firstName}
                                            onChange={e => setField('firstName', e.target.value)}
                                            className={errors.firstName ? 'input-invalid' : ''}
                                        />
                                    </div>
                                    <span className="field-error">{errors.firstName}</span>
                                </div>

                                <div className="input-group">
                                    <label htmlFor="lastName">Last Name</label>
                                    <div className="input-wrap">
                                        <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                            <circle cx="10" cy="7" r="3.5" stroke="currentColor" strokeWidth="1.3"/>
                                            <path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                                        </svg>
                                        <input type="text" id="lastName" placeholder="Dela Cruz" autoComplete="family-name"
                                            value={fields.lastName}
                                            onChange={e => setField('lastName', e.target.value)}
                                            className={errors.lastName ? 'input-invalid' : ''}
                                        />
                                    </div>
                                    <span className="field-error">{errors.lastName}</span>
                                </div>
                            </div>

                            {/* Email */}
                            <div className="input-group">
                                <label htmlFor="registerEmail">Email Address</label>
                                <div className="input-wrap">
                                    <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                        <path d="M2.5 5.5h15l-7.5 6.5-7.5-6.5z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/>
                                        <rect x="2.5" y="5.5" width="15" height="10" rx="1" stroke="currentColor" strokeWidth="1.3"/>
                                    </svg>
                                    <input type="email" id="registerEmail" placeholder="you@example.com" autoComplete="email"
                                        value={fields.email}
                                        onChange={e => setField('email', e.target.value)}
                                        className={errors.email ? 'input-invalid' : ''}
                                    />
                                </div>
                                <span className="field-error">{errors.email}</span>
                            </div>

                            {/* Password */}
                            <div className="input-group">
                                <label htmlFor="registerPassword">Password</label>
                                <div className="input-wrap">
                                    <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                        <rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
                                        <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                                        <circle cx="10" cy="13" r="1.2" fill="currentColor"/>
                                    </svg>
                                    <input type={show.pw ? 'text' : 'password'} id="registerPassword" placeholder="At least 8 characters" autoComplete="new-password"
                                        value={fields.password}
                                        onChange={e => setField('password', e.target.value)}
                                        className={errors.password ? 'input-invalid' : ''}
                                    />
                                    <button type="button" className="eye-btn" onClick={() => setShow(s => ({ ...s, pw: !s.pw }))} tabIndex={-1}>
                                        {show.pw ? <EyeClosed /> : <EyeOpen />}
                                    </button>
                                </div>
                                <span className="field-error">{errors.password}</span>
                            </div>

                            {/* Confirm Password */}
                            <div className="input-group">
                                <label htmlFor="confirmPassword">Confirm Password</label>
                                <div className="input-wrap">
                                    <svg className="input-icon" viewBox="0 0 20 20" fill="none">
                                        <rect x="4" y="9" width="12" height="8" rx="1.5" stroke="currentColor" strokeWidth="1.3"/>
                                        <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                                        <circle cx="10" cy="13" r="1.2" fill="currentColor"/>
                                    </svg>
                                    <input type={show.confirm ? 'text' : 'password'} id="confirmPassword" placeholder="Repeat your password" autoComplete="new-password"
                                        value={fields.confirm}
                                        onChange={e => setField('confirm', e.target.value)}
                                        className={errors.confirm ? 'input-invalid' : ''}
                                    />
                                    <button type="button" className="eye-btn" onClick={() => setShow(s => ({ ...s, confirm: !s.confirm }))} tabIndex={-1}>
                                        {show.confirm ? <EyeClosed /> : <EyeOpen />}
                                    </button>
                                </div>
                                <span className="field-error">{errors.confirm}</span>
                            </div>

                            <button type="submit" className="btn-register">
                                <span>Create Account</span>
                                <svg viewBox="0 0 20 20" fill="none">
                                    <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                                </svg>
                            </button>
                        </form>

                        <p className="signin-link">Already have an account? <a href="login.html">Sign in</a></p>
                    </div>
                </div>
            </div>

            <div className={`toast ${toast.type} ${toast.show ? 'show' : ''}`}>{toast.msg}</div>
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RegisterPage />);
</script>
</body>
</html>
