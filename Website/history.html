<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment History</title>
    <link rel="stylesheet" href="history.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Footer pin */
        html { height: 100%; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        #root { flex: 1; display: flex; flex-direction: column; }
        .navbar { flex-shrink: 0; }
        .main  { flex: 1 0 auto; }
        .footer { flex-shrink: 0; }

        /* Hamburger */
        .hamburger {
            display: none; flex-direction: column; justify-content: center;
            gap: 5px; background: none; border: none;
            cursor: pointer; padding: 6px; z-index: 200;
        }
        .hamburger span {
            display: block; width: 22px; height: 2px;
            background: #fff; border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        /* Mobile menu */
        .mobile-menu {
            display: none; position: fixed;
            top: 64px; left: 0; right: 0;
            background: linear-gradient(135deg, #3b2460, #6b4a8a);
            z-index: 150; flex-direction: column;
            padding: 16px 20px 24px; gap: 4px;
            box-shadow: 0 8px 24px rgba(59,36,96,0.3);
        }
        .mobile-menu.open { display: flex; }
        .mobile-menu .nav-link {
            color: rgba(255,255,255,0.85); font-size: 15px;
            padding: 10px 12px; border-radius: 8px;
            text-decoration: none;
        }
        .mobile-menu .nav-link:hover,
        .mobile-menu .nav-link.active { background: rgba(255,255,255,0.12); color: #fff; }
        .mobile-menu-divider { height: 1px; background: rgba(255,255,255,0.15); margin: 8px 0; }
        .mobile-menu-user {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
        }
        .mobile-menu-user .nav-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(255,255,255,0.18);
            border: 1.5px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 11px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .mobile-menu-user span { color: rgba(255,255,255,0.85); font-size: 14px; }
        .mobile-menu .nav-logout {
            margin: 0; width: 100%; text-align: left;
            font-size: 14px; padding: 10px 12px; border-radius: 8px;
        }

        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-right  { display: none !important; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

const AVATAR_COLORS = {
    amethyst: 'linear-gradient(135deg, #3b2460, #6b4a8a)',
    rose:     'linear-gradient(135deg, #8e2a4e, #c2547a)',
    teal:     'linear-gradient(135deg, #1e5f6e, #4a9aab)',
};

const DEFAULT_COLOR = 'amethyst';

const API_BASE = 'http://127.0.0.1:5000';

function Navbar({activePage, user, onLogout, avatarGradient}) {
    const [menuOpen, setMenuOpen] = useState(false);

    // TODO: Replace with real user from auth context / token
    const username = user?.name || 'User';
    const initials = user?.initials ||
        username.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

    useEffect(() => {
        function handler(e) {
            if (!e.target.closest('.mobile-menu') && !e.target.closest('.hamburger'))
                setMenuOpen(false);
        }
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
    }, []);

    const links = [
        { href: 'home.html',    label: 'Home',               key: 'home'    },
        { href: 'history.html', label: 'Assessment History',  key: 'history' },
        { href: 'about.html',   label: 'About',               key: 'about'   },
    ];

    return (
        <>
            <nav className="navbar">
                <div className="nav-left">
                    <a href="home.html" className="nav-brand">
                        <img src="logo.png" alt="AURA Logo" className="nav-logo" />
                        <div className="nav-brand-text">
                            <span className="nav-title">Automated Assessment of Academic Articles'</span>
                            <span className="nav-subtitle">GAD Responsiveness</span>
                        </div>
                    </a>
                </div>

                {/* Desktop */}
                <div className="nav-right">
                    {links.map(l => (
                        <a key={l.key} href={l.href}
                            className={`nav-link${activePage === l.key ? ' active' : ''}`}>
                            {l.label}
                        </a>
                    ))}
                    <div className="nav-divider"></div>
                    <span
                        className="nav-username"
                        onClick={() => window.location.href = 'profile.html'}
                        style={{ cursor: 'pointer' }}
                        title="View Profile"
                    >
                        {username}
                    </span>
                    <button
                        className="nav-avatar"
                        onClick={() => window.location.href = 'profile.html'}
                        title="View Profile"
                        style={avatarGradient ? { background: avatarGradient, borderColor: 'rgba(255,255,255,0.5)' } : undefined}
                    >
                        <svg
                            className="avatar-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    <button className="nav-logout" onClick={onLogout}>Logout</button>
                </div>

                {/* Hamburger */}
                <button
                    className={`hamburger${menuOpen ? ' open' : ''}`}
                    onClick={() => setMenuOpen(v => !v)}
                    aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
            </nav>

            {/* Mobile dropdown */}
            <div className={`mobile-menu${menuOpen ? ' open' : ''}`}>
                {links.map(l => (
                    <a key={l.key} href={l.href}
                        className={`nav-link${activePage === l.key ? ' active' : ''}`}
                        onClick={() => setMenuOpen(false)}>
                        {l.label}
                    </a>
                ))}
                <div className="mobile-menu-divider"></div>
                <div className="mobile-menu-user">
                    <button
                        className="nav-avatar"
                        onClick={() => window.location.href = 'profile.html'}
                        style={avatarGradient ? { background: avatarGradient, borderColor: 'rgba(255,255,255,0.5)' } : undefined}
                    >
                        <svg
                            className="avatar-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </button>
                    <span
                        onClick={() => window.location.href = 'profile.html'}
                        style={{ cursor: 'pointer' }}
                    >
                        {username}
                    </span>
                </div>
                <button className="nav-logout"
                    onClick={() => { setMenuOpen(false); onLogout(); }}>
                    Logout
                </button>
            </div>
        </>
    );
}

function LogoutModal({ show, onCancel, onConfirm }) {
    if (!show) return null;
    return (
        <div className="modal-overlay"
            onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
            <div className="modal-card">
                <div className="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
                            stroke="currentColor" strokeWidth="1.8"
                            strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                </div>
                <h3 className="modal-title">Sign Out</h3>
                <p className="modal-message">Are you sure you want to log out of your account?</p>
                <div className="modal-actions">
                    <button className="btn-cancel" onClick={onCancel}>Cancel</button>
                    <button className="btn-confirm" onClick={onConfirm}>Yes, Log Out</button>
                </div>
            </div>
        </div>
    );
}

function DeleteModal({ item, onCancel, onConfirm }) {
    if (!item) return null;
    return (
        <div className="modal-overlay"
            onClick={e => { if (e.target === e.currentTarget) onCancel(); }}>
            <div className="modal-card">
                <div className="modal-icon" style={{ color: 'var(--error)' }}>
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"
                            stroke="currentColor" strokeWidth="1.8"
                            strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                </div>
                <h3 className="modal-title">Delete Assessment</h3>
                <p className="modal-message">
                    Delete <strong>{item.filename}</strong>? This can't be undone.
                </p>
                <div className="modal-actions">
                    <button className="btn-cancel" onClick={onCancel}>Cancel</button>
                    <button className="btn-confirm" onClick={onConfirm}>Yes, Delete</button>
                </div>
            </div>
        </div>
    );
}

function SummaryModal({ item, onClose }) {
    const [barWidth, setBarWidth] = useState('0%');

    useEffect(() => {
        if (!item) return;
        setBarWidth('0%');
        const t = setTimeout(() => setBarWidth(`${item.overallScore}%`), 120);
        return () => clearTimeout(t);
    }, [item]);

    if (!item) return null;

    return (
        <div className="modal-overlay"
            onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="summary-card">

                {/* Header */}
                <div className="summary-header">
                    <div className="summary-header-left">
                        <p className="summary-filename">{item.filename}</p>
                        <p className="summary-score-line">{item.overallLabel}</p>
                        <div className="summary-bar-track">
                            <div className="summary-bar-fill"
                                style={{ width: barWidth }}></div>
                        </div>
                    </div>
                    <button className="summary-close" onClick={onClose}>×</button>
                </div>

                {/* Table */}
                {/* Table or empty state */}
                {item.rows && item.rows.length > 0 ? (
                    <table className="summary-table">
                        <thead>
                            <tr>
                                <th>Key Aspects</th>
                                <th>Word/s or Phrase</th>
                                <th>Recommendation</th>
                                <th>Model Source</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            {item.rows.map((row, i) => (
                                <tr key={i}>
                                    <td data-label="Key Aspects">{row.aspect}</td>
                                    <td data-label="Word/s or Phrase">{row.phrase}</td>
                                    <td data-label="Recommendation">{row.recommendation}</td>
                                    <td data-label="Model Source">{row.model}</td>
                                    <td data-label="Score" className="td-score-cell">{row.score}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                ) : (
                    <div className="summary-empty">
                        <div className="summary-empty-icon">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M9 12l2 2 4-4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"
                                    stroke="currentColor" strokeWidth="1.8"
                                    strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>
                        </div>
                        <h4 className="summary-empty-title">No issues detected</h4>
                        <p className="summary-empty-sub">
                            This paper showed full GAD responsiveness — no problematic
                            words, phrases, or authorship imbalances were flagged by the model.
                        </p>
                    </div>
                )}

            </div>
        </div>
    );
}

function formatRelativeTime(ms) {

    if (!ms) return '';
    const now = Date.now();
    const diff = now - ms;
    const mins = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);

    if (mins < 1)  return 'Just now';
    if (mins < 60) return `${mins} minute${mins === 1 ? '' : 's'} ago`;
    if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
    if (days === 1) return 'Yesterday';
    if (days < 7)  return `${days} days ago`;

    // Older than a week — show absolute date
    return new Date(ms).toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
    });
}

function HistoryPage() {

    const [user, setUser] = useState(null);
    const [avatarColor, setAvatarColor] = useState(DEFAULT_COLOR);

    useEffect(() => {
        const token = localStorage.getItem('token');
        if (!token) return;

        fetch(`${API_BASE}/api/user/profile`, {
            headers: { Authorization: `Bearer ${token}` },
        })
            .then(r => (r.ok ? r.json() : null))
            .then(data => {
                if (!data) return;
                const fullName = `${data.firstName || ''} ${data.lastName || ''}`.trim();
                const initials = [data.firstName, data.lastName]
                    .filter(Boolean)
                    .map(n => n[0])
                    .join('')
                    .toUpperCase();
                setUser({ name: fullName || 'User', initials: initials || 'U' });

                const color = (data.avatarColor && AVATAR_COLORS[data.avatarColor])
                    ? data.avatarColor
                    : DEFAULT_COLOR;
                setAvatarColor(color);
            })
            .catch(err => console.error('Failed to load user:', err));
    }, []);

    const [logoutModal, setLogoutModal] = useState(false);
    const [selected, setSelected]       = useState(null);
    const [toDelete, setToDelete]       = useState(null);
    const [history, setHistory]         = useState(null);
    const [error, setError]             = useState(null);

    const loadHistory = useCallback(() => {
        setError(null);
        setHistory(null);

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return;
        }

        fetch(`${API_BASE}/api/history`, {
            headers: { Authorization: `Bearer ${token}` },
        })
            .then(r => {
                if (r.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return null;
                }
                if (!r.ok) throw new Error(`Server returned ${r.status}`);
                return r.json();
            })
            .then(data => {
                if (data) setHistory(data);
            })
            .catch(err => {
                console.error('Failed to load history:', err);
                setError("Couldn't load your history. Check your connection and try again.");
                setHistory([]);
            });
    }, []);

    useEffect(() => { loadHistory(); }, [loadHistory]);

    function doDelete() {
        if (!toDelete) return;
        const token = localStorage.getItem('token');
        const id = toDelete.id;

        fetch(`${API_BASE}/api/history/${id}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${token}` },
        })
            .then(r => {
                if (!r.ok) throw new Error(`Delete failed (${r.status})`);
                return r.json();
            })
            .then(() => {
                // Optimistically remove from the list without re-fetching
                setHistory(h => h.filter(item => item.id !== id));
                setToDelete(null);
            })
            .catch(err => {
                console.error('Delete failed:', err);
                alert("Couldn't delete that assessment. Please try again.");
                setToDelete(null);
            });
    }

    function doLogout() {
        const token = localStorage.getItem('token');
        fetch(`${API_BASE}/api/auth/logout`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
        }).finally(() => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });
    }

    const FileIcon = () => (
        <svg viewBox="0 0 32 32" fill="none">
            <path d="M20 4H10a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10L20 4z"
                stroke="currentColor" strokeWidth="1.5"
                strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M20 4v6h6" stroke="currentColor" strokeWidth="1.5"
                strokeLinecap="round" strokeLinejoin="round"/>
            <path d="M12 17h8M12 21h5" stroke="currentColor" strokeWidth="1.5"
                strokeLinecap="round"/>
        </svg>
    );

    const ChevronIcon = () => (
        <svg viewBox="0 0 20 20" fill="none">
            <path d="M7 4l6 6-6 6" stroke="currentColor" strokeWidth="1.5"
                strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
    );

    const TrashIcon = () => (
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"
                stroke="currentColor" strokeWidth="1.8"
                strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
    );

    return (
        <>
            <Navbar
                activePage="history"
                user={user}
                onLogout={() => setLogoutModal(true)}
                avatarGradient={AVATAR_COLORS[avatarColor] || AVATAR_COLORS[DEFAULT_COLOR]}
            />

            <main className="main">

                {/* Page heading */}
                <div className="history-header">
                    <p className="history-eyebrow">Your Records</p>
                    <h1 className="history-heading">
                        Assessment <em>History</em>
                    </h1>
                    <p className="history-sub">
                        Click any entry to view its full GAD responsiveness breakdown.
                    </p>
                </div>

                {/* List or empty state */}
                {history === null ? (
                    /* Loading skeleton */
                    <div className="history-section">
                        {[1, 2, 3].map(i => (
                            <div key={i} className="history-card"
                                style={{ opacity: 0.4, pointerEvents: 'none' }}>
                                <div className="history-file-icon"><FileIcon /></div>
                                <div className="history-card-body">
                                    <div style={{
                                        height: 14, width: '55%',
                                        background: '#e0d7ef', borderRadius: 6, marginBottom: 8
                                    }}></div>
                                    <div style={{
                                        height: 11, width: '30%',
                                        background: '#ede8f5', borderRadius: 6
                                    }}></div>
                                </div>
                                <div style={{
                                    height: 22, width: 80,
                                    background: '#e0d7ef', borderRadius: 6
                                }}></div>
                            </div>
                        ))}
                    </div>
                ) : error ? (
                    <div className="history-error">
                        <p>{error}</p>
                        <button onClick={loadHistory}>Try Again</button>
                    </div>
                ) : history.length === 0 ? (
                    <div className="history-empty">
                        <div className="history-empty-icon">
                            <svg viewBox="0 0 32 32" fill="none">
                                <path d="M20 4H10a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10L20 4z"
                                    stroke="currentColor" strokeWidth="1.5"
                                    strokeLinecap="round" strokeLinejoin="round"/>
                                <path d="M20 4v6h6" stroke="currentColor" strokeWidth="1.5"
                                    strokeLinecap="round" strokeLinejoin="round"/>
                                <path d="M11 17h10M11 21h6" stroke="currentColor"
                                    strokeWidth="1.5" strokeLinecap="round"/>
                            </svg>
                        </div>
                        <h2 className="history-empty-title">No Assessments Yet</h2>
                        <p className="history-empty-sub">
                            You haven't assessed any documents yet. Upload one from the
                            Home page and your results will appear here.
                        </p>
                        <a href="home.html" className="btn-go-home">
                            <span>Go to Home</span>
                            <svg viewBox="0 0 20 20" fill="none">
                                <path d="M4 10h12M12 6l4 4-4 4" stroke="currentColor"
                                    strokeWidth="1.5" strokeLinecap="round"
                                    strokeLinejoin="round"/>
                            </svg>
                        </a>
                    </div>
                ) : (
                    /* History list */
                    <div className="history-section">
                        {history.map((item, i) => (
                            <div
                                key={item.id ?? i}
                                className="history-card"
                                onClick={() => setSelected(item)}
                                style={{ animationDelay: `${0.3 + i * 0.07}s` }}
                            >
                                <div className="history-file-icon"><FileIcon /></div>

                                <div className="history-card-body">
                                    <p className="history-filename">{item.filename}</p>
                                    <p className="history-meta">
                                        {item.rows?.length ?? 0} issue{(item.rows?.length ?? 0) !== 1 ? 's' : ''} detected
                                    </p>
                                    {item.createdAt && (
                                        <p className="history-timestamp">
                                            {formatRelativeTime(item.createdAt)}
                                        </p>
                                    )}
                                </div>

                                <div className="history-score-wrap">
                                    <span className="history-score-badge">
                                        {item.overallLabel}
                                    </span>
                                    <button
                                        className="history-delete-btn"
                                        onClick={e => {
                                            e.stopPropagation();
                                            setToDelete(item);
                                        }}
                                        title="Delete assessment"
                                        aria-label="Delete assessment">
                                        <TrashIcon />
                                    </button>
                                    <span className="history-chevron">
                                        <ChevronIcon />
                                    </span>
                                </div>
                            </div>
                        ))}
                    </div>
                )}

            </main>

            <footer className="footer">
                <span>© 2025</span>
                <span>Cavite State University — CCAT Campus</span>
                <span>English</span>
            </footer>

            <SummaryModal item={selected} onClose={() => setSelected(null)} />

            <DeleteModal
                item={toDelete}
                onCancel={() => setToDelete(null)}
                onConfirm={doDelete}
            />

            <LogoutModal
                show={logoutModal}
                onCancel={() => setLogoutModal(false)}
                onConfirm={doLogout}
            />
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HistoryPage />);
</script>
</body>
</html>
